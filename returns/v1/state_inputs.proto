// State-specific return inputs: facts and elections needed by state tax returns
// (California Form 540, Oregon Form OR-40, Washington Capital Gains Return)
// that are not already present in Federal1040Inputs.
syntax = "proto3";

package nexteggapp.taxcalcs.returns.v1;

import "taxcalcs/returns/v1/elections.proto";
import "taxcalcs/returns/v1/filing.proto";
import "taxcalcs/returns/v1/input_spec.proto";
import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxcalcs/returns/v1;returnsv1";

// StateInputs requests a state tax return for a specific state and supplies any
// state-only facts, elections, and filing instructions.
message StateInputs {
  // Two-letter US postal state code (e.g. "CA", "OR", "WA").
  string state = 1;

  // State-specific input payload. When a state has no extra facts beyond what
  // Federal1040Inputs already contains, `state` alone is enough to request that
  // state's return.
  oneof inputs {
    // California Form 540 / 540NR inputs.
    CaliforniaInputs ca = 10;

    // Oregon Form OR-40 inputs.
    OregonInputs or = 11;

    // Washington excise tax on long-term capital gains inputs.
    WashingtonInputs wa = 12;

    // Illinois Form IL-1040 inputs.
    IllinoisInputs il = 13;

    // North Carolina Form D-400 inputs.
    NorthCarolinaInputs nc = 14;

    // Colorado Form DR 0104 inputs.
    ColoradoInputs co = 15;

    // Arizona Form 140 inputs.
    ArizonaInputs az = 16;

    // Georgia Form 500 inputs.
    GeorgiaInputs ga = 22;

    // Iowa Form IA 1040 inputs.
    IowaInputs ia = 26;

    // Idaho Form 40 inputs.
    IdahoInputs id = 24;

    // Indiana Form IT-40 inputs.
    IndianaInputs in = 25;

    // Kentucky Form 740 inputs.
    KentuckyInputs ky = 28;

    // Louisiana Form IT-540 inputs.
    LouisianaInputs la = 29;

    // Michigan Form MI-1040 inputs.
    MichiganInputs mi = 33;

    // Mississippi Form 80-105 inputs.
    MississippiInputs ms = 35;

    // Pennsylvania Form PA-40 inputs.
    PennsylvaniaInputs pa = 45;

    // Utah Form TC-40 inputs.
    UtahInputs ut = 48;

    // Oklahoma Form 511 inputs.
    OklahomaInputs ok = 44;

    // Kansas Form K-40 inputs.
    KansasInputs ks = 27;

    // Arkansas Form AR1000F inputs.
    ArkansasInputs ar = 18;

    // Missouri Form MO-1040 inputs.
    MissouriInputs mo = 36;

    // Montana Form 2 inputs.
    MontanaInputs mt = 37;

    // North Dakota Form ND-1 inputs.
    NorthDakotaInputs nd = 42;

    // Nebraska Form 1040N inputs.
    NebraskaInputs ne = 38;
  }
}

// CaliforniaInputs holds California-specific facts, elections, and credits for
// Form 540 and Schedule CA (540).
message CaliforniaInputs {
  // Whether to take the California standard deduction or California itemized
  // deductions (which can differ from the federal election under Cal. Rev. &
  // Tax. Code § 17073.5).
  DeductionMethodElection deduction_method = 1 [(input) = {
    category: INPUT_CATEGORY_ELECTION
    question: "For California Form 540, would you like to take the California standard deduction or itemize?"
    cites: "Cal. Rev. & Tax. Code § 17073.5"
  }];

  // Whether the taxpayer paid rent for at least half the year on their
  // principal residence in California and the property was not exempt from
  // California property tax, for the Nonrefundable Renter's Credit (Cal. Rev.
  // & Tax. Code § 17053.5).
  optional bool qualified_for_renters_credit = 2 [(input) = {
    category: INPUT_CATEGORY_DETERMINATION
    question: "Did you pay rent for at least half the year on your main home in California?"
    cites: "Cal. Rev. & Tax. Code § 17053.5"
  }];

  // California use tax owed on untaxed out-of-state or internet purchases
  // (Form 540 line 91).
  taxprotos.common.v1.Money use_tax = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Whether the household maintained minimum essential health coverage for all
  // months of the year for the California Individual Shared Responsibility
  // Penalty (Form FTB 3853).
  optional bool full_year_health_coverage = 4 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Prior-year California overpayment applied to the current year's estimated
  // tax (Form 540 line 72).
  taxprotos.common.v1.Money prior_year_overpayment_applied = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Amount paid with a California extension (Form FTB 3519).
  taxprotos.common.v1.Money extension_payment = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional California Schedule CA income additions not automatically
  // derived from federal-to-California conformity rules.
  taxprotos.common.v1.Money other_schedule_ca_additions = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional California Schedule CA income subtractions not automatically
  // derived from federal-to-California conformity rules.
  taxprotos.common.v1.Money other_schedule_ca_subtractions = 8 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // California refund delivery and balance-due debit instructions, when
  // different from the federal Filing instructions.
  Filing filing = 9;
}

// OregonInputs holds Oregon-specific facts, elections, and credits for Form OR-40.
message OregonInputs {
  // Whether to take the Oregon standard deduction or Oregon itemized deductions
  // on Schedule OR-A.
  DeductionMethodElection deduction_method = 1 [(input) = {
    category: INPUT_CATEGORY_ELECTION
    question: "For Oregon Form OR-40, would you like to take the Oregon standard deduction or itemize?"
  }];

  // Prior-year Oregon tax liability before refundable credits, used to compute
  // the biennial Oregon Surplus ("Kicker") credit in odd-numbered tax years
  // (Or. Rev. Stat. § 291.349).
  taxprotos.common.v1.Money prior_even_year_oregon_tax_liability = 2 [(input) = {
    category: INPUT_CATEGORY_RECORD
    question: "What was your Oregon tax before refundable credits on your prior even-year Form OR-40 (for the Oregon Kicker credit)?"
    cites: "Or. Rev. Stat. § 291.349"
  }];

  // Contributions to an Oregon College Savings Plan or ABLE account eligible
  // for the Oregon 529/ABLE credit (Or. Rev. Stat. § 315.650).
  taxprotos.common.v1.Money oregon_529_or_able_contributions = 3 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "Or. Rev. Stat. § 315.650"
  }];

  // Qualifying political contributions eligible for the Oregon political
  // contribution credit (Or. Rev. Stat. § 316.102).
  taxprotos.common.v1.Money political_contributions = 4 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "Or. Rev. Stat. § 316.102"
  }];

  // Prior-year Oregon overpayment applied to the current year's estimated tax.
  taxprotos.common.v1.Money prior_year_overpayment_applied = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Amount paid with an Oregon extension.
  taxprotos.common.v1.Money extension_payment = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Oregon income additions on Schedule OR-ASC.
  taxprotos.common.v1.Money other_additions = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Oregon income subtractions on Schedule OR-ASC.
  taxprotos.common.v1.Money other_subtractions = 8 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Oregon refund delivery and balance-due debit instructions, when different
  // from the federal Filing instructions.
  Filing filing = 9;
}

// WashingtonInputs holds Washington-specific facts for the Washington capital
// gains excise tax return (Wash. Rev. Code ch. 82.87).
message WashingtonInputs {
  // Long-term capital gain or loss from the sale of real estate or other
  // exempt assets not already flagged as real estate in Investments (exempt
  // under Wash. Rev. Code § 82.87.050).
  taxprotos.common.v1.Money additional_exempt_long_term_gain = 1 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "Wash. Rev. Code § 82.87.050"
  }];

  // Qualified family-owned small business deduction under Wash. Rev. Code § 82.87.060(4).
  taxprotos.common.v1.Money qualified_family_business_deduction = 2 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "Wash. Rev. Code § 82.87.060(4)"
  }];

  // Donations to Washington-principally-directed qualifying charities during
  // the year, for the charitable donation deduction above the statutory
  // threshold (Wash. Rev. Code § 82.87.060(2)).
  taxprotos.common.v1.Money washington_charity_donations = 3 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "Wash. Rev. Code § 82.87.060(2)"
  }];

  // Washington B&O tax credit or out-of-state capital gains tax credit
  // (Wash. Rev. Code § 82.87.070).
  taxprotos.common.v1.Money other_credits = 4 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "Wash. Rev. Code § 82.87.070"
  }];

  // Payments made toward the Washington capital gains tax with an extension or
  // estimated payment.
  taxprotos.common.v1.Money payments_made = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// IllinoisInputs holds Illinois-specific facts and modifications for Form IL-1040.
message IllinoisInputs {
  // Additional Illinois additions to federal AGI (Schedule M).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Illinois subtractions from federal AGI (Schedule M).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Illinois property tax paid on principal residence (Schedule ICR).
  taxprotos.common.v1.Money property_tax_paid = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// IowaInputs holds Iowa-specific facts and modifications for Form IA 1040.
message IowaInputs {
  // Iowa additions to federal income on IA 1040 Schedule 1 that the federal
  // return does not show (Schedule 1, lines 1 to 11, column A).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Iowa subtractions on IA 1040 Schedule 1 other than Social Security
  // benefits and retirement income, which are figured from the federal return.
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The school district surtax or EMS surtax rate, in whole percent, from the
  // list in the IA 1040 instructions for line 19.
  int32 school_district_surtax_percent = 3 [(input) = {
    category: INPUT_CATEGORY_RECORD
    question: "What is the school district surtax rate, in percent, for the Iowa school district you lived in on December 31?"
    cites: "Iowa Code § 257.21"
  }];

  // Iowa estimated tax payments made for the year (IA 1040 line 29).
  taxprotos.common.v1.Money estimated_tax_payments = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The child and dependent care credit or early childhood development
  // credit figured on the IA 1040 instructions for line 24.
  taxprotos.common.v1.Money child_care_credit = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// MontanaInputs holds Montana-specific facts and adjustments for Form 2.
message MontanaInputs {
  // Montana additions to federal taxable income (Schedule I, Part I, line 7).
  taxprotos.common.v1.Money additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Montana subtractions from federal taxable income (Schedule I, Part I, line 24).
  taxprotos.common.v1.Money subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Montana estimated tax paid for the year (Form 2, line 12).
  taxprotos.common.v1.Money estimated_tax_payments = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// NorthCarolinaInputs holds North Carolina-specific facts and modifications for Form D-400.
message NorthCarolinaInputs {
  // Additional North Carolina additions to federal AGI (Form D-400 Schedule S).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional North Carolina subtractions from federal AGI (Form D-400 Schedule S).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// IndianaInputs holds Indiana-specific facts and modifications for Form
// IT-40. Taxable social security is deducted from the federal return without
// being asked for.
message IndianaInputs {
  // Indiana add-backs to federal AGI (Schedule 1, line 7).
  taxprotos.common.v1.Money add_backs = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Indiana deductions other than taxable social security and railroad
  // retirement benefits (Schedule 2 lines other than 5 and 6), such as the
  // renter's and homeowner's property tax deductions.
  taxprotos.common.v1.Money other_deductions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The two-digit code, from the back of Schedule CT-40, of the Indiana
  // county where the filer lived on January 1. Without it no county tax is
  // figured.
  string county_code = 3 [(input) = {
    category: INPUT_CATEGORY_HOUSEHOLD
    question: "Which Indiana county did you live in on January 1?"
  }];

  // On a joint return, the county code where the spouse lived on January 1,
  // when it differs from the filer's.
  string spouse_county_code = 4 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];

  // When the spouses lived in different counties on January 1, the spouse's
  // share of Indiana adjusted gross income (Schedule CT-40, line 1B).
  taxprotos.common.v1.Money spouse_share_of_income = 5 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Indiana estimated tax and extension payments for the year (Schedule 5,
  // line 4).
  taxprotos.common.v1.Money estimated_tax_payments = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional exemptions for adopted children (Schedule IN-DEP-A, box 6).
  int32 adopted_children = 7 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];
}

// MichiganInputs holds Michigan-specific facts and modifications for Form
// MI-1040. Taxable social security is subtracted from the federal return
// without being asked for.
message MichiganInputs {
  // Michigan additions to federal AGI (Schedule 1, lines 1 through 8).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The deduction by year of birth: the Michigan standard deduction, the
  // retirement and pension deduction from Form 4884, or the senior investment
  // income deduction (Schedule 1, lines 25 through 28).
  taxprotos.common.v1.Money retirement_and_pension_deduction = 2 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Other Michigan subtractions from federal AGI (Schedule 1, lines 10
  // through 13, 15 through 23, and 30).
  taxprotos.common.v1.Money other_subtractions = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The homestead property tax credit from Form MI-1040CR or MI-1040CR-2.
  taxprotos.common.v1.Money property_tax_credit = 4 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Michigan estimated tax and extension payments for the year, and the
  // prior year's overpayment credited forward.
  taxprotos.common.v1.Money estimated_tax_payments = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // People who qualify for the special exemption other than a filer or
  // spouse the household marks blind: the deaf, hemiplegic, paraplegic,
  // quadriplegic, or totally and permanently disabled, and blind dependents.
  int32 special_exemptions = 6 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];

  // Qualified disabled veterans among the filer, spouse and dependents.
  int32 qualified_disabled_veterans = 7 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];
}

// ColoradoInputs holds Colorado-specific facts and modifications for Form DR 0104.
message ColoradoInputs {
  // Additional Colorado additions to federal taxable income (Form DR 0104AD).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Colorado subtractions from federal taxable income (Form DR 0104AD).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// ArizonaInputs holds Arizona-specific facts and modifications for Form 140.
message ArizonaInputs {
  // Additional Arizona additions to federal adjusted gross income.
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Arizona subtractions from federal adjusted gross income.
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// GeorgiaInputs holds Georgia-specific facts and modifications for Form 500.
message GeorgiaInputs {
  // Additional Georgia additions to federal AGI (Form 500 Schedule 1).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Georgia subtractions from federal AGI (Form 500 Schedule 1).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// IdahoInputs holds Idaho-specific facts and modifications for Form 40.
message IdahoInputs {
  // Idaho additions to federal adjusted gross income (Form 39R, Part A).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Idaho subtractions from federal adjusted gross income (Form 39R, Part B),
  // other than taxable Social Security benefits, which the rules subtract.
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Whether the filer received Idaho public assistance payments in the year,
  // which excuses the $10 permanent building fund tax (Form 40 line 31).
  optional bool received_public_assistance = 3 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Whether the filer donates the food tax credit to the Cooperative Welfare
  // Fund instead of claiming it (Form 40 line 43).
  optional bool donate_food_tax_credit = 4 [(input) = {category: INPUT_CATEGORY_ELECTION}];
}

// KentuckyInputs holds Kentucky-specific facts and modifications for Form 740.
message KentuckyInputs {
  // Schedule M additions to federal adjusted gross income other than
  // non-Kentucky municipal bond interest.
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Schedule M subtractions other than taxable social security, which the
  // rules take from the federal return. The pension income exclusion belongs
  // here.
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Interest on other states' municipal bonds, exempt federally but taxed by
  // Kentucky (Schedule M) and counted in modified gross income.
  taxprotos.common.v1.Money non_kentucky_municipal_bond_interest = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Itemized deductions from Kentucky Schedule A. The larger of these and the
  // standard deduction is taken.
  taxprotos.common.v1.Money itemized_deductions = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Kentucky estimated tax and extension payments for the year.
  taxprotos.common.v1.Money estimated_tax_payments = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // How many of the filer and, on a joint return, the spouse were members of
  // the Kentucky National Guard at the end of the year.
  int32 national_guard_members = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// LouisianaInputs holds Louisiana-specific facts for Form IT-540 and its
// Schedule E, Adjustments to Income. Social Security benefits and the
// retirement income exemption for filers 65 or older are worked out from the
// federal return and the Forms 1099-R.
message LouisianaInputs {
  // Interest and dividends from other states' obligations, exempt federally
  // and taxed by Louisiana (Schedule E line 2A).
  taxprotos.common.v1.Money other_state_obligation_interest = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Interest and dividends on U.S. government obligations included in federal
  // AGI (Schedule E code 01E).
  taxprotos.common.v1.Money us_government_obligation_interest = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Other income included in federal AGI that Louisiana exempts, under any
  // Schedule E code not worked out here.
  taxprotos.common.v1.Money other_exempt_income = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Louisiana estimated tax paid for the year (Form IT-540 line 29).
  taxprotos.common.v1.Money estimated_tax_payments = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// MississippiInputs holds Mississippi-specific facts for Form 80-105.
message MississippiInputs {
  // Mississippi itemized deductions from Form 80-108, used when larger than
  // the standard deduction.
  taxprotos.common.v1.Money itemized_deductions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Other Mississippi income not on the federal return, added on line 48.
  taxprotos.common.v1.Money other_income = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // National Guard or Reserve pay, deducted on line 55 up to $15,000.
  taxprotos.common.v1.Money national_guard_or_reserve_pay = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Mississippi estimated and extension payments, line 25.
  taxprotos.common.v1.Money estimated_tax_payments = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// PennsylvaniaInputs holds Pennsylvania-specific facts for Form PA-40.
// Compensation, interest and dividends start from the federal documents; the
// other classes of income are figured under Pennsylvania rules and given here.
message PennsylvaniaInputs {
  // Unreimbursed employee business expenses from PA Schedule UE (Form PA-40 line 1b).
  taxprotos.common.v1.Money unreimbursed_employee_business_expenses = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // PA-taxable interest the federal return does not tax, such as interest on
  // other states' obligations (Form PA-40 line 2, PA Schedule A).
  taxprotos.common.v1.Money additional_interest_income = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Federally taxable interest Pennsylvania exempts, such as interest on U.S.
  // obligations (Form PA-40 line 2, PA Schedule A).
  taxprotos.common.v1.Money excluded_interest_income = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // PA-taxable dividends the federal return does not tax (Form PA-40 line 3,
  // PA Schedule B).
  taxprotos.common.v1.Money additional_dividend_income = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Federally taxable dividends Pennsylvania exempts, such as dividends from
  // U.S. obligations (Form PA-40 line 3, PA Schedule B).
  taxprotos.common.v1.Money excluded_dividend_income = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Net income or loss from a business, profession or farm, figured under
  // Pennsylvania rules (Form PA-40 line 4, PA Schedule C or F).
  taxprotos.common.v1.Money business_income_or_loss = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Net gain or loss from the sale, exchange or disposition of property,
  // figured under Pennsylvania rules (Form PA-40 line 5, PA Schedule D).
  taxprotos.common.v1.Money property_disposition_gain_or_loss = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Net income or loss from rents, royalties, patents or copyrights (Form
  // PA-40 line 6, PA Schedule E).
  taxprotos.common.v1.Money rents_and_royalties_income_or_loss = 8 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Estate or trust income (Form PA-40 line 7, PA Schedule J).
  taxprotos.common.v1.Money estate_or_trust_income = 9 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Gambling and lottery winnings (Form PA-40 line 8, PA Schedule T).
  taxprotos.common.v1.Money gambling_and_lottery_winnings = 10 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Medical and health savings account, tuition account and ABLE account
  // contribution deductions (Form PA-40 line 10, PA Schedule O).
  taxprotos.common.v1.Money other_deductions = 11 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Overpayment credited from the 2024 PA return (Form PA-40 line 14).
  taxprotos.common.v1.Money prior_year_overpayment_credit = 12 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // 2025 estimated installment payments (Form PA-40 line 15).
  taxprotos.common.v1.Money estimated_tax_payments = 13 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Payment made with an extension (Form PA-40 line 16).
  taxprotos.common.v1.Money extension_payment = 14 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Nontaxable income Schedule SP counts toward eligibility income for Tax
  // Forgiveness: tax-exempt interest, alimony, insurance proceeds and
  // inheritances, gifts, nontaxable military pay, excluded gain on a home,
  // educational assistance and support received (Schedule SP Section III,
  // lines 2 through 10).
  taxprotos.common.v1.Money nontaxable_eligibility_income = 15 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Credit for income tax paid to other states (Form PA-40 line 22, PA
  // Schedule G-L).
  taxprotos.common.v1.Money resident_credit = 16 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Other credits from PA Schedules OC and DC (Form PA-40 line 23).
  taxprotos.common.v1.Money other_credits = 17 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Use tax due on untaxed out-of-state purchases (Form PA-40 line 25).
  taxprotos.common.v1.Money use_tax = 18 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// UtahInputs holds Utah-specific facts, modifications and credits for Form
// TC-40 that the federal return does not carry.
message UtahInputs {
  // Additions to income from Schedule TC-40A, Part 1.
  taxprotos.common.v1.Money additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Subtractions from income from Schedule TC-40A, Part 2.
  taxprotos.common.v1.Money subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Whether last year's federal return itemized, which makes a state tax
  // refund on federal Schedule 1 line 1 a subtraction on TC-40 line 7.
  bool itemized_last_year = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Apportionable nonrefundable credits from TC-40A, Part 3, other than the
  // child tax and earned income credits, which are computed.
  taxprotos.common.v1.Money other_apportionable_nonrefundable_credits = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Nonapportionable nonrefundable credits from TC-40A, Part 4.
  taxprotos.common.v1.Money nonapportionable_nonrefundable_credits = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Utah use tax owed on purchases not taxed at the time.
  taxprotos.common.v1.Money use_tax = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Extension prepayments and last year's refund applied to this year.
  taxprotos.common.v1.Money prepaid_tax = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// OklahomaInputs holds Oklahoma-specific facts and modifications for Form 511.
message OklahomaInputs {
  // Oklahoma subtractions from federal adjusted gross income (Schedule 511-A).
  taxprotos.common.v1.Money subtractions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Out-of-state income other than wages (Form 511 line 4).
  taxprotos.common.v1.Money out_of_state_income = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Oklahoma additions to federal adjusted gross income (Schedule 511-B).
  taxprotos.common.v1.Money additions = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Oklahoma adjustments to Oklahoma adjusted gross income (Schedule 511-C).
  taxprotos.common.v1.Money adjustments = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Oklahoma itemized deductions (Schedule 511-D line 11), used when the
  // federal return itemizes.
  taxprotos.common.v1.Money itemized_deductions = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Oklahoma estimated tax payments for the year (Form 511 line 22).
  taxprotos.common.v1.Money estimated_tax_payments = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// KansasInputs holds Kansas-specific facts and modifications for Form K-40.
message KansasInputs {
  // Kansas additions to federal adjusted gross income (Schedule S Part A).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Kansas subtractions from federal adjusted gross income (Schedule S Part
  // A), other than the taxable social security benefits taxcalcs subtracts
  // itself.
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Federal child and dependent care credit allowed on Form 2441, of which
  // Kansas allows 50% on line 14.
  taxprotos.common.v1.Money federal_child_care_credit = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// ArkansasInputs holds Arkansas-specific facts for Form AR1000F.
message ArkansasInputs {
  // Net other income on line 22, from Form AR-OI, including depreciation
  // differences.
  taxprotos.common.v1.Money other_income = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Total adjustments on line 24, from Form AR1000ADJ.
  taxprotos.common.v1.Money adjustments = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Count of filer and spouse who were deaf on December 31, for the personal
  // tax credits on line 7A.
  int32 deaf = 3 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];
}

// MissouriInputs holds Missouri-specific facts and modifications for Form MO-1040.
message MissouriInputs {
  // Total additions from Form MO-A Part 1, line 7Y, for the filer.
  taxprotos.common.v1.Money additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Total additions from Form MO-A Part 1, line 7S, for the spouse.
  taxprotos.common.v1.Money spouse_additions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Total subtractions from Form MO-A Part 1, line 19Y, for the filer.
  taxprotos.common.v1.Money subtractions = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Total subtractions from Form MO-A Part 1, line 19S, for the spouse.
  taxprotos.common.v1.Money spouse_subtractions = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The public and private pension exemptions from Form MO-A Part 3, Sections
  // A and B. Taxable social security benefits are exempted from the federal
  // return without being entered here.
  taxprotos.common.v1.Money pension_exemption = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // On a combined return, the spouse's part of federal adjusted gross income,
  // from the Adjusted Gross Income Worksheet. When absent, the spouse's W-2
  // wages are taken as the spouse's part.
  taxprotos.common.v1.Money spouse_federal_adjusted_gross_income = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // 2025 Missouri estimated tax payments, with any 2024 overpayment applied.
  taxprotos.common.v1.Money estimated_tax_payments = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// NorthDakotaInputs holds North Dakota-specific facts and modifications for Form ND-1.
message NorthDakotaInputs {
  // Total other additions from Schedule ND-1SA (Form ND-1, line 3).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Total other subtractions from Schedule ND-1SA (Form ND-1, line 16).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Interest from U.S. obligations included in federal income (Form ND-1, line 5).
  taxprotos.common.v1.Money us_obligation_interest = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // 2025 estimated tax paid on Forms ND-1ES and ND-1EXT, plus any 2024
  // overpayment applied (Form ND-1, line 27).
  taxprotos.common.v1.Money estimated_tax_payments = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// NebraskaInputs holds Nebraska-specific facts and modifications for Form 1040N.
message NebraskaInputs {
  // Adjustments increasing federal adjusted gross income, Nebraska Schedule I
  // line 13.
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Adjustments decreasing federal adjusted gross income, Nebraska Schedule I
  // line 44, other than the taxable Social Security benefits the rules
  // subtract themselves.
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];
}
