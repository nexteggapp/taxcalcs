  DeductionMethodElection deduction_method = 1 [(input) = {
    category: INPUT_CATEGORY_ELECTION
    question: "For Delaware Form PIT-RES, would you like to take the Delaware standard deduction or itemize?"
    cites: "30 Del. C. § 1108"
  }];

  // Interest on obligations of states and localities other than Delaware
  // (line 2).
  taxprotos.common.v1.Money other_state_obligation_interest = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Fiduciary adjustment and oil depletion (line 3).
  taxprotos.common.v1.Money fiduciary_adjustment_and_oil_depletion = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Interest received on U.S. obligations (line 5).
  taxprotos.common.v1.Money us_obligation_interest = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Pension and retirement exclusions (line 6).
  taxprotos.common.v1.Money pension_exclusion = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // A Delaware refund in federal income and the other line 7 subtractions.
  taxprotos.common.v1.Money other_subtractions = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Contributions to Delaware's 529 tuition program or an ABLE account
  // (line 8b).
  taxprotos.common.v1.Money tuition_and_able_contributions = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The exclusion for people 60 or over, or disabled (line 11).
  taxprotos.common.v1.Money elderly_or_disabled_exclusion = 8 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Total itemized deductions from Delaware Schedule A, Form PIT-RSA
  // (line 13).
  taxprotos.common.v1.Money itemized_deductions = 9 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Credit for tax imposed by other states (line 28).
  taxprotos.common.v1.Money credit_for_tax_paid_to_other_states = 10 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Volunteer firefighter credit (line 29).
  taxprotos.common.v1.Money volunteer_firefighter_credit = 11 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Other non-refundable credits from Form PIT-CRS (line 30).
  taxprotos.common.v1.Money other_nonrefundable_credits = 12 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Estimated tax paid and payments with an extension (line 36).
  taxprotos.common.v1.Money estimated_tax_payments = 13 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// IllinoisInputs holds Illinois-specific facts and modifications for Form IL-1040.
message IllinoisInputs {
  // Additional Illinois additions to federal AGI (Schedule M).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Illinois subtractions from federal AGI (Schedule M).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Illinois property tax paid on principal residence (Schedule ICR).
  taxprotos.common.v1.Money property_tax_paid = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// IowaInputs holds Iowa-specific facts and modifications for Form IA 1040.
message IowaInputs {
  // Iowa additions to federal income on IA 1040 Schedule 1 that the federal
  // return does not show (Schedule 1, lines 1 to 11, column A).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Iowa subtractions on IA 1040 Schedule 1 other than Social Security
  // benefits and retirement income, which are figured from the federal return.
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The school district surtax or EMS surtax rate, in whole percent, from the
  // list in the IA 1040 instructions for line 19.
  int32 school_district_surtax_percent = 3 [(input) = {
    category: INPUT_CATEGORY_RECORD
    question: "What is the school district surtax rate, in percent, for the Iowa school district you lived in on December 31?"
    cites: "Iowa Code § 257.21"
  }];

  // Iowa estimated tax payments made for the year (IA 1040 line 29).
  taxprotos.common.v1.Money estimated_tax_payments = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The child and dependent care credit or early childhood development
  // credit figured on the IA 1040 instructions for line 24.
  taxprotos.common.v1.Money child_care_credit = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// MontanaInputs holds Montana-specific facts and adjustments for Form 2.
message MontanaInputs {
  // Montana additions to federal taxable income (Schedule I, Part I, line 7).
  taxprotos.common.v1.Money additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Montana subtractions from federal taxable income (Schedule I, Part I, line 24).
  taxprotos.common.v1.Money subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Montana estimated tax paid for the year (Form 2, line 12).
  taxprotos.common.v1.Money estimated_tax_payments = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// MaineInputs holds Maine-specific facts, modifications and credits for Form
// 1040ME. The schedules they come from are not modelled.
message MaineInputs {
  // Income addition modifications (Schedule 1A, line 11).
  taxprotos.common.v1.Money income_addition_modifications = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Income subtraction modifications (Schedule 1S, line 27).
  taxprotos.common.v1.Money income_subtraction_modifications = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Maine itemized deductions (Schedule 2, line 7). Used when larger than the
  // standard deduction.
  taxprotos.common.v1.Money itemized_deductions = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Nonrefundable tax credits (Schedule A, line 23).
  taxprotos.common.v1.Money nonrefundable_credits = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Refundable tax credits (Schedule A, line 9).
  taxprotos.common.v1.Money refundable_credits = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Property Tax Fairness Credit (Schedule PTFC/STFC, line 16).
  taxprotos.common.v1.Money property_tax_fairness_credit = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Sales Tax Fairness Credit (Schedule PTFC/STFC, line 17 or 17a).
  taxprotos.common.v1.Money sales_tax_fairness_credit = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // 2025 estimated tax payments, last year's overpayment carried forward and
  // extension payments.
  taxprotos.common.v1.Money estimated_payments = 8 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Use tax owed on purchases (Form 1040ME, line 30).
  taxprotos.common.v1.Money use_tax = 9 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Tax credit recapture amounts (Form 1040ME, line 20a).
  taxprotos.common.v1.Money tax_credit_recapture = 10 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// NorthCarolinaInputs holds North Carolina-specific facts and modifications for Form D-400.
message NorthCarolinaInputs {
  // Additional North Carolina additions to federal AGI (Form D-400 Schedule S).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional North Carolina subtractions from federal AGI (Form D-400 Schedule S).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// IndianaInputs holds Indiana-specific facts and modifications for Form
// IT-40. Taxable social security is deducted from the federal return without
// being asked for.
message IndianaInputs {
  // Indiana add-backs to federal AGI (Schedule 1, line 7).
  taxprotos.common.v1.Money add_backs = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Indiana deductions other than taxable social security and railroad
  // retirement benefits (Schedule 2 lines other than 5 and 6), such as the
  // renter's and homeowner's property tax deductions.
  taxprotos.common.v1.Money other_deductions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The two-digit code, from the back of Schedule CT-40, of the Indiana
  // county where the filer lived on January 1. Without it no county tax is
  // figured.
  string county_code = 3 [(input) = {
    category: INPUT_CATEGORY_HOUSEHOLD
    question: "Which Indiana county did you live in on January 1?"
  }];

  // On a joint return, the county code where the spouse lived on January 1,
  // when it differs from the filer's.
  string spouse_county_code = 4 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];

  // When the spouses lived in different counties on January 1, the spouse's
  // share of Indiana adjusted gross income (Schedule CT-40, line 1B).
  taxprotos.common.v1.Money spouse_share_of_income = 5 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Indiana estimated tax and extension payments for the year (Schedule 5,
  // line 4).
  taxprotos.common.v1.Money estimated_tax_payments = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional exemptions for adopted children (Schedule IN-DEP-A, box 6).
  int32 adopted_children = 7 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];
}

// MichiganInputs holds Michigan-specific facts and modifications for Form
// MI-1040. Taxable social security is subtracted from the federal return
// without being asked for.
message MichiganInputs {
  // Michigan additions to federal AGI (Schedule 1, lines 1 through 8).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The deduction by year of birth: the Michigan standard deduction, the
  // retirement and pension deduction from Form 4884, or the senior investment
  // income deduction (Schedule 1, lines 25 through 28).
  taxprotos.common.v1.Money retirement_and_pension_deduction = 2 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Other Michigan subtractions from federal AGI (Schedule 1, lines 10
  // through 13, 15 through 23, and 30).
  taxprotos.common.v1.Money other_subtractions = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The homestead property tax credit from Form MI-1040CR or MI-1040CR-2.
  taxprotos.common.v1.Money property_tax_credit = 4 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Michigan estimated tax and extension payments for the year, and the
  // prior year's overpayment credited forward.
  taxprotos.common.v1.Money estimated_tax_payments = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // People who qualify for the special exemption other than a filer or
  // spouse the household marks blind: the deaf, hemiplegic, paraplegic,
  // quadriplegic, or totally and permanently disabled, and blind dependents.
  int32 special_exemptions = 6 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];

  // Qualified disabled veterans among the filer, spouse and dependents.
  int32 qualified_disabled_veterans = 7 [(input) = {category: INPUT_CATEGORY_HOUSEHOLD}];
}

// ColoradoInputs holds Colorado-specific facts and modifications for Form DR 0104.
message ColoradoInputs {
  // Additional Colorado additions to federal taxable income (Form DR 0104AD).
  taxprotos.common.v1.Money other_additions = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Additional Colorado subtractions from federal taxable income (Form DR 0104AD).
  taxprotos.common.v1.Money other_subtractions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// HawaiiInputs holds Hawaii-specific facts, modifications and credits for
// Form N-11. The credits are not worked out here: each is entered as its own
// schedule or form figures it.
message HawaiiInputs {
  // Interest on other states' bonds, which Hawaii taxes (Form N-11 line 9).
  taxprotos.common.v1.Money out_of_state_bond_interest = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Other Hawaii additions to federal AGI, including the wage differences of
  // line 8 (Form N-11 lines 8 and 10).
  taxprotos.common.v1.Money other_additions = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Pensions taxed federally that Hawaii exempts (Form N-11 line 13).
  taxprotos.common.v1.Money pensions_not_taxed = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Other Hawaii subtractions from federal AGI (Form N-11 lines 15 to 18).
  taxprotos.common.v1.Money other_subtractions = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Hawaii itemized deductions after any limit, from Worksheets A-1 to A-6
  // (Form N-11 line 22). Zero takes the standard deduction.
  taxprotos.common.v1.Money itemized_deductions = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Refundable food/excise tax credit from Form N-311 (Form N-11 line 28).
  taxprotos.common.v1.Money food_excise_tax_credit = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Credit for low-income household renters from Schedule X (Form N-11 line 29).
  taxprotos.common.v1.Money low_income_renters_credit = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Child and dependent care credit from Schedule X (Form N-11 line 30).
  taxprotos.common.v1.Money child_and_dependent_care_credit = 8 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Other refundable credits: child passenger restraint and Schedule CR
  // (Form N-11 lines 31 and 32).
  taxprotos.common.v1.Money other_refundable_credits = 9 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Nonrefundable credits from Schedule CR (Form N-11 line 35).
