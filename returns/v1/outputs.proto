// NoIncomeTaxReturn reports that a state levies no individual income tax, so
// no state income tax return is due: zero tax, and an informational
// diagnostic citing the state's law.
message NoIncomeTaxReturn {
  // Completion status: complete, since nothing is owed or to be filed.
  ReturnStatus status = 1;

  // Headline figures, all zero, for the state's jurisdiction.
  Summary summary = 2;

  // An informational diagnostic citing the law that leaves the state without
  // an individual income tax.
  repeated Diagnostic diagnostics = 3;

  // Elections placeholder (fields 1-5 match all other *Return messages).
  repeated ResolvedElection elections = 4;

  // Amendment result placeholder (fields 1-5 match all other *Return messages).
  AmendmentResult amendment = 5;
}

