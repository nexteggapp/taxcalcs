// Oregon's own facts for estimated tax, in EstimatedStateInputs. See
// docs/estimated-tax-design.md, "Every state's own messages".
syntax = "proto3";

package nexteggapp.taxcalcs.returns.v1;

option go_package = "github.com/nexteggapp/taxcalcs/returns/v1;returnsv1";

// Oregon's own facts for estimated tax (ORS 316.557 to 316.589; Form OR-10;
// Publication OR-ESTIMATE).
message OregonEstimatedInputs {
  // Last year's Oregon return was or will be filed before this year's. OAR
  // 150-316-0493(3)(a)(B) and Publication OR-ESTIMATE allow the last-year
  // option only then. Unset means unknown: the rules assume it was, and the
  // answer asks when last year's tax sets the target. False closes the
  // last-year option.
  optional bool prior_year_filed_first = 1;

  // ORS 316.563(1)'s gross income test is met: more than $1,000 of gross
  // income other than wages, or gross income over $20,000 ($10,000 on a
  // joint declaration where both spouses have wages, $5,000 for a married
  // individual not entitled to declare jointly). Read only when this year's
  // gross income in EstimatedTaxInputs.farming_and_fishing is not given or is
  // not over $20,000. False means no declaration is required by statute, and
  // the answer says so, though the interest is still figured as Form OR-10
  // figures it. Unset means unknown: the rules assume it is met, and the
  // answer asks.
  optional bool gross_income_test_met = 2;

  // For a part-year resident, the instalment periods with income from an
  // Oregon trade or business while living elsewhere. Form OR-10 divides the
  // required annual payment over the periods of Oregon residence and of such
  // income. Unset means unknown: only the periods of residence count, and the
  // answer asks.
  optional OregonBusinessIncome oregon_business_income = 3;
}

// The instalment periods in which a part-year resident had income from an
// Oregon trade or business while living elsewhere.
message OregonBusinessIncome {
  // The periods, numbered from 1 for the period ending on the first due date
  // to 4 for the one ending on the last, each at most once. Empty answers
  // that there were none.
  repeated int32 periods = 1;
}
