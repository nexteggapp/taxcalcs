// Estimated tax payments, extension payments, applied prior-year overpayments,
// and other tax payments not already shown as withholding on a Form W-2 or
// Form 1099.
syntax = "proto3";

package nexteggapp.taxcalcs.returns.v1;

import "taxcalcs/returns/v1/input_spec.proto";
import "taxprotos/common/v1/date.proto";
import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxcalcs/returns/v1;returnsv1";

// Payments holds the household's non-withholding tax payments for the year.
message Payments {
  // Whether the household has finished listing all estimated and extension tax
  // payments.
  optional bool complete = 1 [(input) = {
    category: INPUT_CATEGORY_RECORD
    question: "Did you make any quarterly estimated tax payments, apply a refund from last year, or pay with an extension?"
  }];

  // Prior-year federal overpayment elected on the prior return to be applied to
  // the current year's estimated tax (included in Form 1040 line 26).
  taxprotos.common.v1.Money prior_year_federal_overpayment_applied = 2 [(input) = {
    category: INPUT_CATEGORY_RECORD
    question: "How much of last year's federal refund did you apply to this year's taxes?"
    feeds: "federal.forms.form_1040.line_26_estimated_tax_payments"
  }];

  // Quarterly and other estimated tax payments made for the current tax year
  // (federal and state; dated so Schedule A SALT deducts state payments made
  // during the calendar year and Form 1040 / state returns credit payments made
  // for the tax year).
  repeated EstimatedPayment estimated_payments = 3;

  // Amount paid with a federal automatic extension of time to file (Form 4868 /
  // Schedule 3 line 10).
  taxprotos.common.v1.Money federal_extension_payment = 4 [(input) = {
    category: INPUT_CATEGORY_RECORD
    feeds: "federal.forms.schedule_3.line_10_amount_paid_with_extension"
  }];

  // Federal tax withholding from forms not otherwise listed in Documents (such
  // as Form 1042-S or Form 8805; Form 1040 line 25c).
  taxprotos.common.v1.Money other_federal_withholding = 5 [(input) = {
    category: INPUT_CATEGORY_RECORD
    feeds: "federal.forms.form_1040.line_25c_other_withholding"
  }];

  // Credit for federal tax paid on fuels (Form 4136 / Schedule 3 line 12).
  taxprotos.common.v1.Money credit_for_federal_tax_on_fuels = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Cumulative income and deduction figures by period for the Form 2210
  // Schedule AI Annualized Income Installment Method (26 U.S.C. § 6654(d)(2)).
  AnnualizedIncomePeriods annualized_income = 7;

  // Waiver and special safe-harbor flags for the Form 2210 estimated tax
  // underpayment penalty (26 U.S.C. § 6654(e)(3)).
  EstimatedPenaltyWaiver penalty_waiver = 8;
}

// EstimatedPayment is a single estimated tax payment to the IRS or a state or
// local tax authority.
message EstimatedPayment {
  // Tax authority to which the payment was made: "US" for federal, or the
  // two-letter postal code ("CA", "OR", etc.) for a state.
  string jurisdiction = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Date the payment was paid (or postmarked / debited).
  taxprotos.common.v1.Date date_paid = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Tax year for which the payment was designated (normally matches
  // ReturnInputs.tax_year, or tax_year - 1 when a Q4 state estimated payment
  // for the prior year was paid in January of the current calendar year).
  int32 designated_tax_year = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Amount of the estimated tax payment.
  taxprotos.common.v1.Money amount = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// AnnualizedIncomePeriods holds cumulative AGI and itemized deductions for the
// four IRS annualization periods (Jan 1 - Mar 31, Jan 1 - May 31, Jan 1 - Aug 31,
// and Jan 1 - Dec 31) on Form 2210 Schedule AI (26 U.S.C. § 6654(d)(2)).
message AnnualizedIncomePeriods {
  // Cumulative adjusted gross income for Jan 1 - Mar 31 (annualization factor 4.0).
  taxprotos.common.v1.Money period_1_agi = 1 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Cumulative adjusted gross income for Jan 1 - May 31 (annualization factor 2.4).
  taxprotos.common.v1.Money period_2_agi = 2 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Cumulative adjusted gross income for Jan 1 - Aug 31 (annualization factor 1.5).
  taxprotos.common.v1.Money period_3_agi = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Cumulative itemized deductions for Jan 1 - Mar 31 (annualization factor 4.0).
  taxprotos.common.v1.Money period_1_deductions = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Cumulative itemized deductions for Jan 1 - May 31 (annualization factor 2.4).
  taxprotos.common.v1.Money period_2_deductions = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Cumulative itemized deductions for Jan 1 - Aug 31 (annualization factor 1.5).
  taxprotos.common.v1.Money period_3_deductions = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Actual federal income tax withheld in Period 1 (Jan 1 - Apr 15) when electing
  // actual withholding dates instead of equal 25% quarterly credits on Form 2210
  // line 6 (26 U.S.C. § 6654(g)).
  taxprotos.common.v1.Money q1_actual_withholding = 7 [(input) = {category: INPUT_CATEGORY_ELECTION}];

  // Actual federal income tax withheld in Period 2 (Apr 16 - Jun 15).
  taxprotos.common.v1.Money q2_actual_withholding = 8 [(input) = {category: INPUT_CATEGORY_ELECTION}];

  // Actual federal income tax withheld in Period 3 (Jun 16 - Sep 15).
  taxprotos.common.v1.Money q3_actual_withholding = 9 [(input) = {category: INPUT_CATEGORY_ELECTION}];

  // Actual federal income tax withheld in Period 4 (Sep 16 - Dec 31).
  taxprotos.common.v1.Money q4_actual_withholding = 10 [(input) = {category: INPUT_CATEGORY_ELECTION}];
}

// EstimatedPenaltyWaiver holds waiver and farmer/fisherman safe-harbor flags
// for Form 2210 (26 U.S.C. § 6654(e)(3), (i)).
message EstimatedPenaltyWaiver {
  // Amount of underpayment penalty for which the taxpayer requests a waiver due
  // to casualty, disaster, retirement after age 62, or disability (Form 2210
  // Box A or Box B).
  taxprotos.common.v1.Money requested_waiver_amount = 1 [(input) = {
    category: INPUT_CATEGORY_ELECTION
    cites: "26 U.S.C. § 6654(e)(3)"
  }];

  // Whether at least two-thirds of gross income for the prior or current year
  // was from farming or commercial fishing (qualifying for the 66.67% single-
  // installment safe harbor on Form 2210-F; 26 U.S.C. § 6654(i)).
  optional bool qualified_farmer_or_fisherman = 2 [(input) = {
    category: INPUT_CATEGORY_DETERMINATION
    cites: "26 U.S.C. § 6654(i)"
  }];
}

