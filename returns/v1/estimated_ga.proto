// Georgia's own facts for estimated tax, in EstimatedStateInputs. See
// docs/estimated-tax.md, "Every state's own messages".
syntax = "proto3";

package nexteggapp.taxcalcs.returns.v1;

import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxcalcs/returns/v1;returnsv1";

// Georgia's own facts for estimated tax (O.C.G.A. §§ 48-7-114 to 48-7-120;
// Form 500-ES; Form 500 UET).
message GeorgiaEstimatedInputs {
  // This year's estimated deductions, standard or itemised, for the test of
  // gross income against the dependent exemptions, the deductions and
  // $1,000 of income not subject to withholding (Form 500-ES). Unset means
  // the standard deduction for the filing status, $15,000, or $30,000
  // married filing jointly, for 2026 (HB 463 § 2-3), and the answer asks.
  optional taxprotos.common.v1.Money estimated_deductions = 1;

  // The number of dependents claimed on Form 500, at $5,000 each for 2026
  // (HB 463 § 2-2), for the same test. Unset means none, and the answer asks.
  optional uint32 dependents = 2;

  // Last year's Georgia taxable income. Form 500 UET Exception 1 excuses an
  // instalment when the payments to its date reach the tax on it at this
  // year's rate, a quarter for each instalment so far (line 14; Instruction
  // D). Read only when last year's tax can set the target. Unset means
  // Exception 1 is not tested, and the answer asks.
  optional taxprotos.common.v1.Money prior_year_taxable_income = 3;

  // The employer, by agreement, withholds additional tax to cover the
  // filer's income; estimated tax is then not required (Form 500-ES).
  bool employer_withholding_agreement = 4;
}
