// Maryland's own facts for estimated tax, in EstimatedStateInputs. See
// docs/estimated-tax-design.md, "Every state's own messages".
syntax = "proto3";

package nexteggapp.taxcalcs.returns.v1;

import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxcalcs/returns/v1;returnsv1";

// Maryland's own facts for estimated tax (Md. Code, Tax-General §§ 13-602
// and 13-604; Form 502UP). The income received by each period's end, which
// Form 502UP lines 11 to 13 read, is the core's
// EstimatedTaxInputs.CallerEstimate.PeriodTax.income.
message MarylandEstimatedInputs {
  // This year's local (county or Baltimore City) income tax, inside this
  // year's tax, which Maryland measures as "Maryland and local income tax"
  // (Payment Voucher Worksheet, 2026). Form 502UP's exception for income
  // taxable by another state (code 302) compares the underpayment to it.
  // Unset means unknown, and the answer asks for it when the exception
  // could apply.
  optional taxprotos.common.v1.Money county_tax = 1;

  // At least 90% of this year's taxable income is also taxable by another
  // state. Form 502UP then charges no interest when the underpayment is not
  // greater than the local tax (code 302; Tax-General § 13-602(b)). Unset
  // means not said, and the answer asks.
  optional bool taxable_by_another_state = 2;

  // This year's expected Maryland adjusted gross income (Form 502 line 16).
  // The 2026 Payment Voucher Worksheet asks for 110% of last year's tax only
  // "if you will receive more income than you did in 2025", where Form 502UP
  // and § 13-602(a)(2) set no condition. This figure, with last year's
  // Maryland AGI, decides only whether that reading would change the
  // target, which the answer reports as a divergence affecting the
  // household. Unset means unknown, and the divergence is not reported as
  // affecting it. Added with Maryland's rules, which read it.
  optional taxprotos.common.v1.Money maryland_agi = 3;
}
