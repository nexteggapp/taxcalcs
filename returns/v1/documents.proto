// OtherSale is a sale no Form 1099-B reports, such as a digital asset sale
// without a broker form, stock in a private company, or a personal item sold
// at a gain.
message OtherSale {
  // The sale's id, unique across the inputs.
  string id = 1;

  // The id of the seller: a Person.id.
  string person = 2;

  // What was sold, as Form 8949 column (a) describes it.
  string description = 3 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The date acquired. Unset with `inherited` for inherited property.
  taxprotos.common.v1.Date date_acquired = 4 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The date sold or disposed of.
  taxprotos.common.v1.Date date_sold = 5 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The proceeds, net of selling expenses unless reported separately.
  taxprotos.common.v1.Money proceeds = 6 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The cost or other basis.
  taxprotos.common.v1.Money basis = 7 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Selling expenses not netted from the proceeds.
  taxprotos.common.v1.Money selling_expenses = 8 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // The property was inherited, which makes the holding period long-term
  // (26 U.S.C. § 1223(9)).
  optional bool inherited = 9 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The property is a digital asset, which decides the Form 8949 box.
  optional bool digital_asset = 10 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The property is a collectible taxed at up to 28%.
  optional bool collectible = 11 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The property was held for personal use, so a loss isn't deductible.
  optional bool personal_use = 12 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // A wash sale loss disallowed under 26 U.S.C. § 1091.
  taxprotos.common.v1.Money wash_sale_loss_disallowed = 13 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Gain excluded, and under which provision.
  taxprotos.common.v1.Money excluded_gain = 14 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The provision `excluded_gain` falls under.
  GainExclusion exclusion = 15 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Where the sale came from.
  taxprotos.facts.v1.DocumentRef source = 16;

  // Alternative Minimum Tax (AMT) adjusted cost basis when different from
  // regular tax basis (feeds Form 6251 line 2k).
  taxprotos.common.v1.Money amt_basis = 17 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "26 U.S.C. § 56(b)(3)"
  }];
}
