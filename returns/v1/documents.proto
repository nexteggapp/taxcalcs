  string sale = 10 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];
}

// Form1099CDocument is a Form 1099-C and the facts that decide whether the
// canceled debt is income.
message Form1099CDocument {
  // The document's id.
  string id = 1;

  // The id of the debtor: a Person.id.
  string person = 2;

  // Where the document came from.
  taxprotos.facts.v1.DocumentRef source = 3;

  // The form as printed.
  taxprotos.us.federal.v1.Form1099C form = 4;

  // Why some or all of the canceled debt is excluded from income, for Form
  // 982.
  DebtExclusion exclusion = 10 [(input) = {
    category: INPUT_CATEGORY_DETERMINATION
    cites: "26 U.S.C. § 108(a)"
  }];

  // For the insolvency exclusion, how far liabilities exceeded the fair
  // market value of assets immediately before the cancellation.
  taxprotos.common.v1.Money insolvency_amount = 11 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The id of the Business whose debt it was, when it was business debt.
  string business = 12 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];
}

// DebtExclusion is why canceled debt is excluded from income under 26 U.S.C.
// § 108.
enum DebtExclusion {
  // Not said, or none: the canceled debt is income.
  DEBT_EXCLUSION_UNSPECIFIED = 0;

  // Discharged in a Title 11 bankruptcy case.
  DEBT_EXCLUSION_BANKRUPTCY = 1;

  // To the extent insolvent.
  DEBT_EXCLUSION_INSOLVENCY = 2;

  // Qualified farm indebtedness.
  DEBT_EXCLUSION_FARM = 3;

  // Qualified real property business indebtedness.
  DEBT_EXCLUSION_REAL_PROPERTY_BUSINESS = 4;

  // Qualified principal residence indebtedness, while the law allows it.
  DEBT_EXCLUSION_PRINCIPAL_RESIDENCE = 5;

  // Qualified student loan discharge.
  DEBT_EXCLUSION_STUDENT_LOAN = 6;

  // The debt was for nondeductible personal property and is excluded as a
  // purchase price reduction, or is otherwise not income.
  DEBT_EXCLUSION_OTHER = 7;
}

// Form1099QDocument is a Form 1099-Q and what the distribution paid for.
message Form1099QDocument {
  // The document's id.
  string id = 1;

  // The id of the recipient: a Person.id or Dependent.id.
  string person = 2;

  // Where the document came from.
  taxprotos.facts.v1.DocumentRef source = 3;

  // The form as printed.
  taxprotos.us.federal.v1.Form1099Q form = 4;

  // The id of the Student whose qualified expenses the distribution paid.
  string student = 10 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The amount rolled over to another qualified tuition program or ABLE
  // account, or to a Roth IRA under 26 U.S.C. § 529(c)(3)(E).
  taxprotos.common.v1.Money rolled_over = 11 [(input) = {category: INPUT_CATEGORY_RECORD}];
}

// Form1099SADocument is a Form 1099-SA and what the distribution paid for.
message Form1099SADocument {
  // The document's id.
  string id = 1;

  // The id of the account holder: a Person.id.
  string person = 2;

  // Where the document came from.
  taxprotos.facts.v1.DocumentRef source = 3;

  // The form as printed.
  taxprotos.us.federal.v1.Form1099SA form = 4;

  // The part of the distribution spent on qualified medical expenses not
  // reimbursed otherwise, which isn't taxed (Form 8889 line 15).
  taxprotos.common.v1.Money qualified_medical_expenses = 10 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // An exception to the additional 20% tax applies, such as death,
  // disability or reaching 65.
  optional bool additional_tax_exception = 11 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];
}

// Form1098Document is a Form 1098 and what the mortgage is on.
message Form1098Document {
  // The document's id.
  string id = 1;

  // The id of the borrower: a Person.id.
  string person = 2;

  // Where the document came from.
  taxprotos.facts.v1.DocumentRef source = 3;

  // The form as printed.
  taxprotos.us.federal.v1.Form1098 form = 4;

  // What the loan was used for, which decides where its interest goes.
  MortgageUse use = 10 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The id of the Business or RentalProperty whose expenses include the
  // interest, for a mortgage on business or rental property.
  string activity = 11 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // The share of the interest deductible as home mortgage interest, as a
  // percentage, when the home is partly used for business or rented.
  taxprotos.common.v1.Quantity personal_use_percent = 12 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // For the home mortgage interest limit (Pub. 936): the date the debt was
  // incurred, since debt from before December 16, 2017 has the higher limit.
  taxprotos.common.v1.Date debt_incurred_on = 13 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // For the limit: the average balance of the debt during the year, when the
  // household's home debt may exceed the limit.
  taxprotos.common.v1.Money average_balance = 14 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Interest paid to this lender that the form doesn't show, such as for
  // part of a year after a loan was sold.
  taxprotos.common.v1.Money interest_not_on_form = 15 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Whether this loan was refinanced, sold, or paid off during the tax year
  // (so its balance should be weighted by active months rather than summed as a
  // concurrent loan when computing the Pub. 936 average mortgage balance).
  optional bool refinanced_or_paid_off_in_year = 16 [(input) = {category: INPUT_CATEGORY_DETERMINATION}];

  // Number of months this loan was active during the tax year (1 to 12; used to
  // weight the balance across a mid-year refinance or sale under Pub. 936).
  int32 months_active = 17 [(input) = {category: INPUT_CATEGORY_RECORD}];

  // Portion of the loan balance from a cash-out refinance that was not used to
  // buy, build, or substantially improve the home securing the loan (not
  // deductible as home acquisition debt under 26 U.S.C. § 163(h)(3)(F)).
  taxprotos.common.v1.Money cash_out_not_for_home_improvement = 18 [(input) = {
    category: INPUT_CATEGORY_RECORD
    cites: "26 U.S.C. § 163(h)(3)(F)"
  }];
}

// MortgageUse is what a mortgage loan was used for.
enum MortgageUse {
  // Not said: unanswered.
  MORTGAGE_USE_UNSPECIFIED = 0;

  // To buy, build or substantially improve the main home or a second home
  // that secures it: home acquisition debt.
  MORTGAGE_USE_HOME_ACQUISITION = 1;

  // Secured by the home but used for something else, such as a home equity
  // loan spent on a car, whose interest isn't deductible.
  MORTGAGE_USE_HOME_EQUITY_OTHER = 2;

  // For a business or rental activity.
  MORTGAGE_USE_BUSINESS_OR_RENTAL = 3;

  // To buy investment property, whose interest goes on Form 4952.
  MORTGAGE_USE_INVESTMENT = 4;
}

