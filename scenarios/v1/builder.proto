// The scenario builder page, as taxyear describes it, and the one change the
// page sends back.
//
// A BuilderView is everything the page shows for one scenario, beside Your
// plan: groups of items, each with its figures, fields, sources and
// computed lines. The page renders it and computes nothing. Every change
// the page makes is an Edit, which taxyear.ApplyEdit turns into a change to
// the file.
syntax = "proto3";

package nexteggapp.taxcalcs.scenarios.v1;

import "taxcalcs/scenarios/v1/result.proto";
import "taxprotos/common/v1/date.proto";
import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";
import "taxprotos/facts/v1/documents.proto";

option go_package = "github.com/nexteggapp/taxcalcs/scenarios/v1;scenariosv1";

// The builder page for one scenario.
message BuilderView {
  // The id of the scenario shown.
  string scenario = 1;

  // Every scenario in the file, for the list down the left, in the file's
  // order.
  repeated ScenarioTab scenarios = 2;

  // About you, Income, Deductions, Tax paid and From last year, in that
  // order. A group with no items is left out.
  repeated Group groups = 3;

  // The federal return's lines that are not zero in this scenario or Your
  // plan, in the form's order.
  repeated FormLine lines = 4;

  // Questions that belong to no item.
  repeated QuestionView questions = 5;

  // What the figures leave out, for the panel at the bottom of the page.
  repeated NotIncluded not_included = 6;

  // The scenario's problems. When set, its figures are not computed.
  repeated Problem problems = 7;

  // The button that adds a scenario based on this one.
  Action new_scenario = 8;

  // The result the page opens with: what is owed or refunded with the
  // federal return, and the federal tax for the year. Unset while the
  // scenario has problems.
  Headline headline = 9;
}

// The result the page opens with, for the scenario shown.
message Headline {
  // What is owed with the federal return, labelled "You owe", or refunded,
  // labelled "Your refund". The amount is never negative. With nothing
  // either way it is labelled "Nothing to pay" and is zero. your_plan is
  // unset: Your plan's is plan_balance, which can be the other way.
  FormLine balance = 1;

  // Your plan's balance, labelled as balance is, its amount in your_plan.
  // Unset in Your plan itself.
  FormLine plan_balance = 2;

  // The federal tax for the year, Form 1040 line 24, with Your plan's.
  FormLine total_tax = 3;
}

// One scenario in the list down the left.
message ScenarioTab {
  // The scenario's id.
  string id = 1;

  // What the household calls it.
  string name = 2;

  // The id of the scenario it changes. Empty for Your plan.
  string parent = 3;

  // The scenario's name as a text field, whose edit renames it. Unset for
  // Your plan, which keeps its name.
  Field name_field = 4;

  // What its menu offers: Duplicate, and Delete for any scenario but Your
  // plan.
  repeated Action actions = 5;
}

// One group of items, such as Income.
message Group {
  // "about", "income", "deductions", "tax_paid" or "last_year".
  string id = 1;

  // The group's heading, such as "Income".
  string label = 2;

  // The group's total, where it has one, such as total income. The
  // figures of its items that are not not_counted add up to it. Tax paid
  // has none: the federal and state payments add up to nothing on a
  // return. Deductions' total is the adjustments to income and the
  // deductions together, which no one line holds, so its path is empty
  // and its working names the two lines.
  FormLine total = 3;

  // The group's items, in the inputs' order.
  repeated BuilderItem items = 4;
}

// One row on the page: a person, a job, an account, a part of a model, a
// jurisdiction's payments. Its id is the same in every scenario.
message BuilderItem {
  // Stable in every scenario: the path of what it shows in a scenario's
  // inputs, such as "model.employers[acme]", or in its result, such as
  // "estimated[US]".
  string id = 1;

  // The item's name, such as "Acme Corp".
  string label = 2;

  // One line on how the rest of the year is filled, such as "Same as latest
  // paycheck". Empty when the item has no rest of the year.
  string method = 3;

  // The item's figure for the year in this scenario. Unset when it has
  // none.
  Figure this_scenario = 4;

  // The same figure in Your plan. Unset in Your plan itself, or when Your
  // plan has no such item.
  Figure your_plan = 5;

  // Whether this scenario, or one it is based on, changes the item. Unset:
  // the same as in the scenario it is based on.
  Status status = 6;

  // The documents and bank entries the item rests on.
  repeated Source sources = 7;

  // What can be typed or chosen, in the inputs' order.
  repeated Field fields = 8;

  // What is shown and not edited: computed lines, limits and proposals.
  repeated Display displays = 9;

  // The item's parts, such as each change to a job's pay.
  repeated BuilderItem children = 10;

  // Buttons that make a whole change at once, such as adding a part or
  // removing one.
  repeated Action actions = 11;

  // The questions about this item.
  repeated QuestionView questions = 12;

  // Sentences shown under the item, such as whether a person counts as a
  // dependent.
  repeated Statement notes = 13;

  // One line saying what the item holds now, shown under its name, such
  // as "Single" or "$2,100 for the year; $769 of it doesn't count". Empty
  // when the figure says it all.
  string summary = 14;

  // The figure is shown but is not in the group's total, as the standard
  // deduction is when the return itemises.
  bool not_counted = 15;

  // The page draws the item open at first, as for a part of a job the
  // household is asked about.
  bool start_open = 16;
}

// One amount, and where it is in a scenario's result.
message Figure {
  // The amount.
  taxprotos.common.v1.Money amount = 1;

  // Its field path in the scenario's result. Empty for a sum the result
  // doesn't hold.
  string path = 2;
}

// How a scenario changes an item or a field, against the scenario it is
// based on. Your plan is the base, so nothing in it has a status.
message Status {
  // What changed it.
  StatusKind kind = 1;

  // For CHANGED_IN_PARENT, the id of the nearest scenario up the chain
  // that changes it.
  string changed_in = 2;

  // That scenario's name.
  string changed_in_name = 3;
}

// What changed an item or a field.
enum StatusKind {
  // Not set.
  STATUS_KIND_UNSPECIFIED = 0;

  // This scenario changes it: the page marks it Changed and offers Reset.
  STATUS_KIND_CHANGED_HERE = 1;

  // A scenario this one is based on changes it, other than Your plan.
  STATUS_KIND_CHANGED_IN_PARENT = 2;
}

// A document or bank entry a figure rests on.
message Source {
  // What the page calls it, such as "Aug 31 paystub".
  string label = 1;

  // Where it is.
  oneof ref {
    // A document in the vault.
    taxprotos.facts.v1.DocumentRef document = 2;

    // An entry in the bank ledger.
    taxprotos.facts.v1.LedgerRef ledger = 3;
  }
}

// One value the household can type or choose.
message Field {
  // Where an edit goes. A path into a scenario's inputs, such as
  // "model.employers[acme].parts[acme-0fjb8x60].pay_rate.from"; or, for a
  // figure that can be overridden, its path in the scenario's result, such
  // as "projection.employers[acme].so_far.items.gross".
  string path = 1;

  // The field's label, such as "Gross pay".
  string label = 2;

  // One sentence under the field. Empty when it needs none.
  string help = 3;

  // What kind of control it is.
  FieldKind kind = 4;

  // The value the figures use in this scenario. Unset when nothing is
  // set.
  Value value = 5;

  // The same field's value in Your plan, for the compared column. Unset in
  // Your plan, or when Your plan has no such field.
  Value your_plan = 6;

  // Whether this scenario, or one it is based on, changes it. Unset: the
  // same as in the scenario it is based on.
  Status status = 7;

  // For a figure that can be overridden: what the library computes, shown
  // beside an override and never replaced by it.
  Value automatic = 8;

  // The figure is overridden: value is the household's and automatic the
  // library's.
  bool overridden = 9;

  // The override's sources have changed since it was typed, so automatic
  // is not the figure the household saw.
  bool sources_changed = 10;

  // What the automatic value rests on.
  repeated Source automatic_sources = 11;
}

// The kind of control a field is, with what it needs to be drawn. Exactly
// one is set.
message FieldKind {
  // An amount of money.
  message Money {
    // The least that may be typed. Unset: zero.
    taxprotos.common.v1.Money at_least = 1;

    // The most that may be typed. Unset: no limit.
    taxprotos.common.v1.Money at_most = 2;

    // A negative amount is allowed, as for a gain or loss.
    bool signed = 3;
  }

  // A percentage, typed as a number.
  message Percent {}

  // A number that is not money, such as months or shares.
  message Number {}

  // A day.
  message Date {
    // The earliest day allowed. Unset: no limit.
    taxprotos.common.v1.Date earliest = 1;

    // The latest day allowed. Unset: no limit.
    taxprotos.common.v1.Date latest = 2;
  }

  // One of a closed list.
  message Choice {
    // The options, in order.
    repeated Option options = 1;
  }

  // Yes, no or not sure.
  message YesNo {
    // "Not sure" is offered.
    bool not_sure = 1;
  }

  // One of the household's people.
  message Person {
    // The people, by their id, in the facts' order.
    repeated Option options = 1;
  }

  // Free text.
  message Text {}

  // A choice between ways of working out a figure, such as how to count a
  // job's pay for the year. Each option is a whole change, so choosing
  // one sends its edit rather than the option's value. The field's value
  // is the chosen option's value.
  message Method {
    // The ways offered, in order. Only those that apply and whose preview
    // could be computed.
    repeated MethodOption options = 1;
  }

  // What kind it is.
  oneof kind {
    // An amount of money.
    Money money = 1;

    // A percentage.
    Percent percent = 2;

    // A number that is not money.
    Number number = 3;

    // A day.
    Date date = 4;

    // One of a list.
    Choice choice = 5;

    // Yes, no or not sure.
    YesNo yes_no = 6;

    // A person.
    Person person = 7;

    // Free text.
    Text text = 8;

    // A choice between ways of working something out.
    Method method = 9;
  }
}

// One way of working out a figure, with what it would give.
message MethodOption {
  // Stable while it is offered, such as "same_as_latest". The method
  // field's value names the chosen one.
  string value = 1;

  // What the page shows, such as "I know the full year's pay".
  string label = 2;

  // One sentence on what it does.
  string description = 3;

  // The figure it would give from what is known now, such as the year's
  // pay, so options can be compared before one is chosen. Unset when the
  // option gives no figure until something is typed; preview_text then
  // says so.
  FormLine preview = 4;

  // What choosing it sends. Unset for the chosen option.
  Edit edit = 5;

  // The chosen option's short form: what can be typed for it. Empty on an
  // option not chosen.
  repeated Field fields = 6;

  // The chosen option's figures, such as the pay so far and the paychecks
  // still to come. Empty on an option not chosen.
  repeated FormLine lines = 7;

  // Words shown in place of a preview figure, for an option that gives no
  // figure until something is typed, such as "You type the total". Set only
  // when preview is unset.
  string preview_text = 8;
}

// One option of a choice.
message Option {
  // What the edit sends: an enum value's name, or a person's id.
  string value = 1;

  // What the page shows, such as "Every other week".
  string label = 2;
}

// A field's value, or what an edit does. Exactly one is set.
message Value {
  // Remove what the path names: a list item or a set field.
  message Remove {}

  // Take the value of the scenario this one is based on: the scenario
  // stops changing it, which the page calls Reset. For an override,
  // remove it.
  message Inherit {}

  // The value.
  oneof kind {
    // For a money field.
    taxprotos.common.v1.Money money = 1;

    // For a percent or number field.
    taxprotos.common.v1.Quantity number = 2;

    // For a date field.
    taxprotos.common.v1.Date date = 3;

    // For a choice field: the option's value.
    string choice = 4;

    // For a yes or no field.
    YesNo yes_no = 5;

    // For a text or person field.
    string text = 6;

    // A whole message of the type the path names, in binary protobuf, as
    // an Action's edit adds a part. The page passes it on without reading
    // it.
    bytes message = 7;

    // Remove what the path names.
    Remove remove = 8;

    // Take the parent scenario's value.
    Inherit inherit = 9;
  }
}

// An answer to a yes or no question.
enum YesNo {
  // Not answered.
  YES_NO_UNSPECIFIED = 0;

  // Yes.
  YES_NO_YES = 1;

  // No.
  YES_NO_NO = 2;

  // Not sure.
  YES_NO_NOT_SURE = 3;
}

// Something shown and not edited. Exactly one is set.
message Display {
  // What it is.
  oneof kind {
    // A computed line, with how it was worked out.
    FormLine figure = 1;

    // A deduction with a floor or a limit, in three lines.
    LimitLines limit_lines = 2;

    // A change the chat agent offers, with its evidence.
    Proposal proposal = 3;
  }
}

// One computed figure, read-only.
message FormLine {
  // Its field path in the scenario's result, such as
  // "federal.form_1040.w2_wages".
  string path = 1;

  // What the page calls it, such as "Wages".
  string label = 2;

  // The figure in this scenario.
  taxprotos.common.v1.Money this_scenario = 3;

  // The figure in Your plan. Unset in Your plan itself.
  taxprotos.common.v1.Money your_plan = 4;

  // How it was worked out. Unset when the result has no working for it.
  Working working = 5;

  // Its line or box on the form, such as "1a" on Form 1040 or "12 D" on a
  // W-2. Set only where the page lists a form's lines: Form 1040 and a
  // job's W-2 boxes. Form 1040's numbers are the
  // 2025 form's until the IRS publishes the year's.
  string line = 6;
}

// A deduction with a floor or a limit: the year's amount, the floor or
// limit, and what counts.
message LimitLines {
  // The amount for the year.
  FormLine for_year = 1;

  // The floor or limit.
  FormLine limit = 2;

  // What counts.
  FormLine counted = 3;
}

// A change the chat agent offers. Nothing changes until the household
// accepts it, which sends its edits.
message Proposal {
  // Stable while it is offered.
  string id = 1;

  // What it changes, in a sentence.
  Statement text = 2;

  // The edits accepting it sends.
  repeated Edit edits = 3;

  // What the agent read to offer it.
  repeated Source evidence = 4;
}

// A question, with its answers as ready edits.
message QuestionView {
  // The question, as the result asks it.
  Question question = 1;

  // One button per answer, in the question's order. Empty when an answer
  // is typed into the field at the question's answer_path instead.
  repeated Action answers = 2;
}

// A button that sends one edit.
message Action {
  // What the button says, such as "Add a pay change".
  string label = 1;

  // What it sends.
  Edit edit = 2;
}

// The one change the page sends: put a value at a path, for a scenario.
//
// Two paths change the file's list of scenarios rather than a scenario's
// inputs. "scenario" with a message, a whole Scenario whose id is
// `scenario`, adds it; with Remove it deletes the scenario, and each
// scenario based on it is rebased onto its parent with the same inputs.
// "scenario.name" with text renames it.
message Edit {
  // The scenario edited, or the one an edit of "scenario" adds.
  string scenario = 1;

  // A field's path, as Field.path gives it, or "scenario" or
  // "scenario.name".
  string path = 2;

  // What to put there.
  Value value = 3;
}

// Several edits, applied in order.
message Edits {
  // The edits.
  repeated Edit edits = 1;
}

// What the WebAssembly entry point's compute returns: the whole result and
// one scenario's page.
message BuilderPage {
  // Every scenario's figures.
  TaxYearResult result = 1;

  // The page for the scenario asked for.
  BuilderView view = 2;
}
