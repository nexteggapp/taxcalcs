// The other income model: retirement withdrawals, Social Security,
// unemployment, state refunds, rental, alimony, gambling and home sales. See
// docs/models.md.
syntax = "proto3";

package nexteggapp.taxcalcs.scenarios.v1;

import "taxcalcs/scenarios/v1/actual.proto";
import "taxprotos/common/v1/date.proto";
import "taxprotos/common/v1/money.proto";
import "taxprotos/facts/v1/documents.proto";
import "taxprotos/us/federal/v1/form_1099_c/form_1099_c.proto";
import "taxprotos/us/federal/v1/form_1099_g/form_1099_g.proto";
import "taxprotos/us/federal/v1/form_1099_misc/form_1099_misc.proto";
import "taxprotos/us/federal/v1/form_1099_q/form_1099_q.proto";
import "taxprotos/us/federal/v1/form_1099_r/form_1099_r.proto";
import "taxprotos/us/federal/v1/form_1099_s/form_1099_s.proto";
import "taxprotos/us/federal/v1/form_1099_sa/form_1099_sa.proto";
import "taxprotos/us/federal/v1/form_ssa_1099/form_ssa_1099.proto";
import "taxprotos/us/federal/v1/form_w2g/form_w2g.proto";
import "taxprotos/us/federal/v1/schedule_k1/schedule_k1_1041.proto";
import "taxprotos/us/federal/v1/schedule_k1/schedule_k1_1065.proto";
import "taxprotos/us/federal/v1/schedule_k1/schedule_k1_1120_s.proto";

option go_package = "github.com/nexteggapp/taxcalcs/scenarios/v1;scenariosv1";

// One source of other income. It has no slots: its parts add items on their
// dates.
message OtherIncomeModel {
  // The model's id. A part's id starts with it.
  string id = 1;

  // What kind of income it is.
  OtherIncomeKind kind = 2;

  // Who pays it, such as the plan, agency or casino.
  string payer = 3;

  // For a state refund, the state's postal code.
  string state = 4;

  // For rental income or a home sale, what the household calls the property.
  string property = 5;

  // The source's parts, known and assumed.
  repeated OtherIncomePart parts = 6;

  // For a state refund, whether the federal return that deducted the
  // refunded tax itemised, which decides whether the refund is income. A
  // refund can be of an earlier year than last, so it is the refund's own.
  // Unset: last year's PriorYearReturn.itemised.
  optional bool refund_year_itemised = 7;
}

// What kind of other income a model is.
enum OtherIncomeKind {
  // Not set.
  OTHER_INCOME_KIND_UNSPECIFIED = 0;

  // Retirement withdrawals, reported on a 1099-R.
  OTHER_INCOME_KIND_RETIREMENT_WITHDRAWALS = 1;

  // Social Security benefits, reported on an SSA-1099.
  OTHER_INCOME_KIND_SOCIAL_SECURITY = 2;

  // Unemployment compensation, reported on a 1099-G.
  OTHER_INCOME_KIND_UNEMPLOYMENT = 3;

  // A state or local income tax refund, reported on a 1099-G.
  OTHER_INCOME_KIND_STATE_REFUND = 4;

  // Rent from one property.
  OTHER_INCOME_KIND_RENTAL = 5;

  // Alimony received under an agreement made before 2019.
  OTHER_INCOME_KIND_ALIMONY = 6;

  // Gambling winnings, reported on a W-2G.
  OTHER_INCOME_KIND_GAMBLING = 7;

  // The sale of a home.
  OTHER_INCOME_KIND_HOME_SALE = 8;
}

// What kind of retirement distribution a planned one is.
enum DistributionKind {
  // Not set.
  DISTRIBUTION_KIND_UNSPECIFIED = 0;

  // A withdrawal from a retirement account.
  DISTRIBUTION_KIND_WITHDRAWAL = 1;

  // A conversion of a traditional IRA or plan balance to a Roth IRA.
  DISTRIBUTION_KIND_ROTH_CONVERSION = 2;
}

// A rental's expenses for the year, by Schedule E line.
message RentalExpenses {
  // Line 5, advertising.
  taxprotos.common.v1.Money advertising = 1;

  // Line 6, auto and travel.
  taxprotos.common.v1.Money auto_and_travel = 2;

  // Line 7, cleaning and maintenance.
  taxprotos.common.v1.Money cleaning_and_maintenance = 3;

  // Line 8, commissions.
  taxprotos.common.v1.Money commissions = 4;

  // Line 9, insurance.
  taxprotos.common.v1.Money insurance = 5;

  // Line 10, legal and other professional fees.
  taxprotos.common.v1.Money legal_and_professional = 6;

  // Line 11, management fees.
  taxprotos.common.v1.Money management_fees = 7;

  // Line 12, mortgage interest paid to banks.
  taxprotos.common.v1.Money mortgage_interest = 8;

  // Line 13, other interest.
  taxprotos.common.v1.Money other_interest = 9;

  // Line 14, repairs.
  taxprotos.common.v1.Money repairs = 10;

  // Line 15, supplies.
  taxprotos.common.v1.Money supplies = 11;

  // Line 16, taxes.
  taxprotos.common.v1.Money taxes = 12;

  // Line 17, utilities.
  taxprotos.common.v1.Money utilities = 13;

  // Line 18, depreciation expense or depletion.
  taxprotos.common.v1.Money depreciation = 14;

  // Line 19, other.
  taxprotos.common.v1.Money other = 15;
}

// One part of a source's year. Each part's comment gives its origin and
// kind.
message OtherIncomePart {
  // Known, whole year: the source's forms. Each states the source's year,
  // so the assumed parts stand aside, except those whose actual lists it as
  // a different payment.
  message FromForms {
    // One form, with its ref.
    message Form {
      // Taxpayer-side figures for a Form 1099-SA distribution (Form 8889
      // Part II, 26 U.S.C. § 223(f)).
      message Form1099SASupplement {
        // Unreimbursed qualified medical expenses paid with the distribution
        // (Form 8889 line 15).
        taxprotos.common.v1.Money qualified_expenses = 1;

        // Any portion rolled over to another HSA or Archer MSA within 60 days
        // (Form 8889 line 14b).
        taxprotos.common.v1.Money rollover = 2;
      }

      // Taxpayer-side figures for a Form 1099-S real estate closing
      // (26 U.S.C. §§ 1001, 1011, 121; Publication 523).
      message Form1099SSupplement {
        // The property's adjusted cost basis (purchase price plus capital
        // improvements).
        taxprotos.common.v1.Money basis = 1;

        // Selling expenses such as commissions and closing costs.
        taxprotos.common.v1.Money selling_expenses = 2;

        // The § 121 principal residence gain exclusion.
        taxprotos.common.v1.Money excluded_amount = 3;
      }

      // Taxpayer-side figures for a Form 1099-C cancellation of debt
      // (Form 982, 26 U.S.C. § 108).
      message Form1099CSupplement {
        // Discharged debt excluded under § 108 (Form 982 insolvency,
        // bankruptcy, or qualified principal residence indebtedness).
        taxprotos.common.v1.Money excluded_amount = 1;
      }

      // Taxpayer-side figures for a Form 1099-Q 529 or Coverdell ESA
      // distribution (26 U.S.C. §§ 529(c)(3), 530(d)(2); Publication 970).
      message Form1099QSupplement {
        // Adjusted qualified higher education expenses paid with the
        // distribution.
        taxprotos.common.v1.Money qualified_expenses = 1;

        // Any portion rolled over to another qualified education account.
        taxprotos.common.v1.Money rollover = 2;
      }

      // Unique in the model.
      string id = 1;

      // The form, as printed.
      oneof form {
        // A Form 1099-R.
        taxprotos.us.federal.v1.Form1099R form_1099_r = 2;

        // A Form SSA-1099.
        taxprotos.us.federal.v1.FormSSA1099 form_ssa_1099 = 3;

        // A Form 1099-G.
        taxprotos.us.federal.v1.Form1099G form_1099_g = 4;

        // A Form W-2G.
        taxprotos.us.federal.v1.FormW2G form_w2g = 5;

        // A Form 1099-MISC.
        taxprotos.us.federal.v1.Form1099MISC form_1099_misc = 8;

        // A Form 1099-SA.
        taxprotos.us.federal.v1.Form1099SA form_1099_sa = 9;

        // A Form 1099-S.
        taxprotos.us.federal.v1.Form1099S form_1099_s = 10;

        // A Form 1099-C.
        taxprotos.us.federal.v1.Form1099C form_1099_c = 11;

        // A Form 1099-Q.
        taxprotos.us.federal.v1.Form1099Q form_1099_q = 12;

        // A Schedule K-1 (Form 1065).
        taxprotos.us.federal.v1.ScheduleK1Form1065 schedule_k1_1065 = 13;

        // A Schedule K-1 (Form 1120-S).
        taxprotos.us.federal.v1.ScheduleK1Form1120S schedule_k1_1120_s = 14;

        // A Schedule K-1 (Form 1041).
        taxprotos.us.federal.v1.ScheduleK1Form1041 schedule_k1_1041 = 15;
      }

      // Supplemental taxpayer-side figures not printed on the form itself.
      oneof supplement {
        // Supplemental figures for a Form 1099-SA.
        Form1099SASupplement form_1099_sa_supplement = 16;

        // Supplemental figures for a Form 1099-S.
        Form1099SSupplement form_1099_s_supplement = 17;

        // Supplemental figures for a Form 1099-C.
        Form1099CSupplement form_1099_c_supplement = 18;

        // Supplemental figures for a Form 1099-Q.
        Form1099QSupplement form_1099_q_supplement = 19;
      }

      // Where it came from.
      taxprotos.facts.v1.DocumentRef source = 6;

      // Earlier forms this one corrects, which then count for nothing.
      repeated taxprotos.facts.v1.DocumentRef replaces = 7;
    }

    // The forms, in any order. Two forms from one payer both count.
    repeated Form forms = 1;
  }

  // Known, additive: credits found in the bank, such as a state refund.
  message FromLedger {
    // One credit, with its ref.
    message Credit {
      // Unique in the model.
      string id = 1;

      // The day it posted.
      taxprotos.common.v1.Date date = 2;

      // The amount received.
      taxprotos.common.v1.Money amount = 3;

      // The bank entry it came from.
      taxprotos.facts.v1.LedgerRef source = 4;
    }

    // The credits, in any order.
    repeated Credit credits = 1;
  }

  // Assumed, whole year: the year's figures, evidence included. A recurring
  // source is spread monthly, any other dated December 31.
  message YearAmount {
    // The year's gross amount: the distribution, benefits, compensation,
    // refund, rents, alimony or winnings.
    taxprotos.common.v1.Money gross = 1;

    // The taxable part of gross, for a retirement withdrawal. Unset: the
    // rules work it out.
    taxprotos.common.v1.Money taxable = 2;

    // Federal income tax withheld.
    taxprotos.common.v1.Money federal_withheld = 3;

    // For rental income, the year's expenses.
    taxprotos.common.v1.Money expenses = 4;

    // Paid monthly through the year, such as Social Security.
    bool recurring = 5;

    // For rental income, the year's expenses by Schedule E line. When set,
    // expenses is their sum.
    RentalExpenses rental_expenses = 6;
  }

  // Assumed, additive: a withdrawal, a Roth conversion or a home sale on
  // `date`.
  message OneOff {
    // A retirement withdrawal or Roth conversion.
    message Distribution {
      // A withdrawal or a conversion.
      DistributionKind kind = 1;

      // The gross distribution.
      taxprotos.common.v1.Money gross = 2;

      // The taxable amount.
      taxprotos.common.v1.Money taxable = 3;

      // Federal income tax withheld.
      taxprotos.common.v1.Money federal_withheld = 4;

      // The 1099-R distribution code, such as "7".
      string code = 5;
    }

    // The sale of a home.
    message HomeSale {
      // The sale price, less selling costs.
      taxprotos.common.v1.Money price = 1;

      // The home's basis.
      taxprotos.common.v1.Money basis = 2;

      // Selling expenses such as commissions and closing costs.
      taxprotos.common.v1.Money selling_expenses = 3;

      // The § 121 principal residence exclusion.
      taxprotos.common.v1.Money excluded_amount = 4;
    }

    // The day of the event.
    taxprotos.common.v1.Date date = 1;

    // What happens.
    oneof event {
      // A withdrawal or Roth conversion.
      Distribution distribution = 2;

      // A home sale.
      HomeSale home_sale = 3;
    }

    // The household's answer to "Is this the one you planned?".
    Actual actual = 4;
  }

  // The part's id: the model's id and 8 random letters and digits.
  string id = 1;

  // What the part is. Exactly one is set.
  oneof part {
    // Known, whole year: forms.
    FromForms from_forms = 2;

    // Known, additive: bank credits.
    FromLedger from_ledger = 3;

    // Assumed, whole year: the year's figures.
    YearAmount year_amount = 4;

    // Assumed, additive: a one-off event.
    OneOff one_off = 5;
  }
}
