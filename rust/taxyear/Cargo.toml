[package]
name = "taxcalcs-taxyear"
description = "Computes a tax year from a TaxYearScenarios file."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
proto = { package = "taxcalcs-proto", path = "../proto" }
money = { package = "taxcalcs-money", path = "../money" }
filing = { package = "taxcalcs-filing", path = "../filing" }
working = { package = "taxcalcs-working", path = "../working" }
estimated = { package = "taxcalcs-estimated", path = "../estimated" }
estimated_all = { package = "taxcalcs-estimated-all", path = "../estimated/all" }
ustaxcalc = { package = "taxcalcs-ustaxcalc", path = "../ustaxcalc" }
returns = { package = "taxcalcs-returns", path = "../returns" }
protodiffgen = { package = "taxcalcs-protodiffgen", path = "../protodiffgen" }
taxlisp = { package = "taxcalcs-taxlisp", path = "../taxlisp" }

[dev-dependencies]
golden = { package = "taxcalcs-golden", path = "../golden" }

[lints]
workspace = true
